<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>7 · שתי קבוצות</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* אפשרות 7 · שתי קבוצות
   הנתונים מחולקים לשתי קבוצות עם כותרת: "העסקה" ו"פריסת התשלומים".
   הכותרות אינן קישוט, הן אומרות למוכר מה הוא קורא ללקוח. */
:root{
  --bg:#EDF0F2; --card:#fff; --ink:#121212; --muted:#6C7378;
  --rule:#E2E5E7; --soft:#F7F9FA; --err:#B42318; --err-bg:#FEF3F2;
  --shadow:0 1px 2px rgba(18,18,18,.05), 0 14px 34px -20px rgba(18,18,18,.28);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 17px/1.6 Rubik,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:clamp(26px,4vw,48px) 20px 56px;
}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.masthead{text-align:center}
.masthead img{width:164px;height:auto}
.masthead h1{margin:12px 0 0;font-size:1.35rem;font-weight:700}

.inputs{
  background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);
  padding:22px clamp(18px,3vw,28px);
  display:grid;gap:22px;grid-template-columns:1fr 1fr;
}
@media (max-width:560px){.inputs{grid-template-columns:1fr}}
.field label{display:block;font-size:.95rem;color:var(--muted);margin-bottom:8px}
.hint{opacity:.75;white-space:nowrap}
.box{display:flex;align-items:stretch;border:1px solid var(--ink);background:var(--card)}
.box input{flex:1 1 auto;min-width:0;width:100%;border:0;outline:0;background:transparent;
  font:700 1.75rem/1 Rubik,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);
  padding:15px 16px;text-align:start}
.box .suffix{display:grid;place-items:center;padding:0 16px;font-size:1.05rem;color:var(--muted);
  background:var(--soft);border-inline-start:1px solid var(--rule)}
.box:focus-within{box-shadow:inset 0 0 0 1px var(--ink)}
.field.bad .box{border-color:var(--err);background:var(--err-bg)}
.field.bad .box .suffix{background:transparent}
.err{display:flex;gap:6px;margin:8px 0 0;font-size:.9rem;color:var(--err);line-height:1.45}
.err[hidden]{display:none}
.err::before{content:"!";flex:0 0 auto;width:17px;height:17px;margin-top:3px;display:grid;
  place-items:center;border-radius:50%;background:var(--err);color:#fff;font-size:.72rem;font-weight:700}

.answer{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow)}
.answer.void{opacity:.26}
.band{
  background:var(--ink);color:#fff;padding:24px clamp(18px,3vw,30px);
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.band .k{font-size:1.15rem;color:rgba(255,255,255,.8)}
.band .v{font-size:clamp(2rem,5vw,2.5rem);font-weight:700;line-height:1.05}

.group + .group{border-top:1px solid var(--rule)}
.group .cap{
  padding:14px clamp(18px,3vw,30px) 0;
  font-size:.85rem;font-weight:500;letter-spacing:.11em;color:var(--muted);
}
.pair{display:grid;grid-template-columns:1fr 1fr;padding-bottom:4px}
@media (max-width:520px){.pair{grid-template-columns:1fr}}
.cell{padding:14px clamp(18px,3vw,30px) 22px}
.cell + .cell{border-inline-start:1px solid var(--rule)}
@media (max-width:520px){
  .cell + .cell{border-inline-start:0;border-top:1px solid var(--rule);padding-top:16px}
}
.cell h3{margin:0 0 7px;font-size:1rem;font-weight:400;color:var(--muted);line-height:1.3}
.cell .v{font-size:2.05rem;font-weight:700;line-height:1.1}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img id="logo" alt="Triple Y" width="420" height="238">
    <h1>תוספת תשלומים</h1>
  </header>

  <section class="inputs">
    <div class="field" id="f-amount">
      <label for="amount">סכום העסקה</label>
      <div class="box">
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="4000">
        <span class="suffix" aria-hidden="true">₪</span>
      </div>
      <p class="err" id="e-amount" role="alert" hidden></p>
    </div>
    <div class="field" id="f-pay">
      <label for="payments">מספר תשלומים <span class="hint">4 עד 24</span></label>
      <div class="box">
        <input id="payments" type="text" inputmode="numeric" autocomplete="off" value="12">
      </div>
      <p class="err" id="e-pay" role="alert" hidden></p>
    </div>
  </section>

  <section class="answer" id="answer">
    <div class="band">
      <span class="k">תוספת על התשלומים</span>
      <span class="v" id="o-fee"></span>
    </div>

    <div class="group">
      <div class="cap">העסקה</div>
      <div class="pair">
        <div class="cell"><h3>סכום מקורי</h3><div class="v" id="o-base"></div></div>
        <div class="cell"><h3>סך הכול לתשלום</h3><div class="v" id="o-total"></div></div>
      </div>
    </div>

    <div class="group">
      <div class="cap">פריסת התשלומים</div>
      <div class="pair">
        <div class="cell"><h3>תשלום ראשון</h3><div class="v" id="o-first"></div></div>
        <div class="cell"><h3 id="o-restlabel"></h3><div class="v" id="o-rest"></div></div>
      </div>
    </div>
  </section>

</div>
<script src="shared.js"></script>
</body>
</html>
