<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>2 · כרטיס עם פס שחור</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* אפשרות 2 · כרטיס עם פס שחור
   קרקע אפורה וכרטיסים לבנים. התוספת יושבת בפס שחור בראש הכרטיס,
   אבל במידה: 2rem, ולא הגוש הענק. */
:root{
  --bg:#EDF0F2; --card:#fff; --ink:#121212; --muted:#6C7378;
  --rule:#E2E5E7; --soft:#F5F7F8; --err:#B42318; --err-bg:#FEF3F2;
  --shadow:0 1px 2px rgba(18,18,18,.05), 0 12px 30px -18px rgba(18,18,18,.28);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 17px/1.6 Rubik,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:clamp(28px,5vw,52px) 18px 56px;
}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.masthead{text-align:center}
.masthead img{width:158px;height:auto}
.masthead h1{margin:12px 0 0;font-size:1.3rem;font-weight:700}

.inputs{
  background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);
  padding:20px;display:grid;gap:18px;grid-template-columns:1fr 1fr;
}
@media (max-width:440px){.inputs{grid-template-columns:1fr}}
.field label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:7px}
.hint{opacity:.75;white-space:nowrap}
.box{display:flex;align-items:stretch;border:1px solid var(--ink);background:var(--card)}
.box input{flex:1 1 auto;min-width:0;width:100%;border:0;outline:0;background:transparent;
  font:700 1.5rem/1 Rubik,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);
  padding:13px 14px;text-align:start}
.box .suffix{display:grid;place-items:center;padding:0 14px;font-size:1rem;color:var(--muted);
  background:var(--soft);border-inline-start:1px solid var(--rule)}
.box:focus-within{box-shadow:inset 0 0 0 1px var(--ink)}
.field.bad .box{border-color:var(--err);background:var(--err-bg)}
.field.bad .box .suffix{background:transparent}
.err{display:flex;gap:6px;margin:7px 0 0;font-size:.87rem;color:var(--err);line-height:1.45}
.err[hidden]{display:none}
.err::before{content:"!";flex:0 0 auto;width:16px;height:16px;margin-top:3px;display:grid;
  place-items:center;border-radius:50%;background:var(--err);color:#fff;font-size:.7rem;font-weight:700}

.answer{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow)}
.answer.void{opacity:.26}
.band{
  background:var(--ink);color:#fff;padding:18px 20px;
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.band .k{font-size:1rem;color:rgba(255,255,255,.78)}
.band .v{font-size:2rem;font-weight:700;line-height:1.1}

.ledger{margin:0;padding:6px 20px 14px}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0}
.r + .r{border-top:1px solid var(--rule)}
.r .k{color:var(--muted);font-size:1rem}
.r .v{font-weight:500;font-size:1.1rem}
.r.total .k{color:var(--ink);font-weight:700}
.r.total .v{font-weight:700;font-size:1.2rem}
.r.sub .k{font-size:.98rem}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img id="logo" alt="Triple Y" width="420" height="238">
    <h1>תוספת תשלומים</h1>
  </header>

  <section class="inputs">
    <div class="field" id="f-amount">
      <label for="amount">סכום העסקה</label>
      <div class="box">
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="4000">
        <span class="suffix" aria-hidden="true">₪</span>
      </div>
      <p class="err" id="e-amount" role="alert" hidden></p>
    </div>
    <div class="field" id="f-pay">
      <label for="payments">מספר תשלומים <span class="hint">4 עד 24</span></label>
      <div class="box">
        <input id="payments" type="text" inputmode="numeric" autocomplete="off" value="12">
      </div>
      <p class="err" id="e-pay" role="alert" hidden></p>
    </div>
  </section>

  <section class="answer" id="answer">
    <div class="band">
      <span class="k">תוספת על התשלומים</span>
      <span class="v" id="o-fee"></span>
    </div>
    <div class="ledger">
      <div class="r"><span class="k">סכום מקורי</span><span class="v" id="o-base"></span></div>
      <div class="r total"><span class="k">סך הכול לתשלום</span><span class="v" id="o-total"></span></div>
      <div class="r sub"><span class="k">תשלום ראשון</span><span class="v" id="o-first"></span></div>
      <div class="r sub"><span class="k" id="o-restlabel"></span><span class="v" id="o-rest"></span></div>
    </div>
  </section>

</div>
<script src="shared.js"></script>
</body>
</html>
