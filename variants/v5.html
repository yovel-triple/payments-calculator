<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>5 · אריחים</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* אפשרות 5 · אריחים
   חמישה מספרים בחמישה אריחים. התוספת ברוחב מלא ובמילוי שחור,
   וארבעת האחרים ברשת 2 על 2. נועד לסריקה מהירה במבט אחד. */
:root{
  --bg:#F1F3F5; --card:#fff; --ink:#121212; --muted:#6C7378;
  --rule:#E2E5E7; --soft:#F7F9FA; --err:#B42318; --err-bg:#FEF3F2;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 17px/1.6 Rubik,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:clamp(28px,5vw,52px) 18px 56px;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.masthead{text-align:center}
.masthead img{width:158px;height:auto}
.masthead h1{margin:12px 0 0;font-size:1.3rem;font-weight:700}

.inputs{
  background:var(--card);border:1px solid var(--rule);padding:20px;
  display:grid;gap:18px;grid-template-columns:1fr 1fr;
}
@media (max-width:460px){.inputs{grid-template-columns:1fr}}
.field label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:7px}
.hint{opacity:.75;white-space:nowrap}
.box{display:flex;align-items:stretch;border:1px solid var(--ink);background:var(--card)}
.box input{flex:1 1 auto;min-width:0;width:100%;border:0;outline:0;background:transparent;
  font:700 1.5rem/1 Rubik,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);
  padding:13px 14px;text-align:start}
.box .suffix{display:grid;place-items:center;padding:0 14px;font-size:1rem;color:var(--muted);
  background:var(--soft);border-inline-start:1px solid var(--rule)}
.box:focus-within{box-shadow:inset 0 0 0 1px var(--ink)}
.field.bad .box{border-color:var(--err);background:var(--err-bg)}
.field.bad .box .suffix{background:transparent}
.err{display:flex;gap:6px;margin:7px 0 0;font-size:.87rem;color:var(--err);line-height:1.45}
.err[hidden]{display:none}
.err::before{content:"!";flex:0 0 auto;width:16px;height:16px;margin-top:3px;display:grid;
  place-items:center;border-radius:50%;background:var(--err);color:#fff;font-size:.7rem;font-weight:700}

.answer{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.answer.void{opacity:.26}
.tile{background:var(--card);border:1px solid var(--rule);padding:16px 18px}
.tile h3{margin:0 0 5px;font-size:.9rem;font-weight:400;color:var(--muted)}
.tile .v{font-size:1.3rem;font-weight:700;line-height:1.2}

.tile.lead{
  grid-column:1 / -1;background:var(--ink);border-color:var(--ink);color:#fff;
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.tile.lead h3{margin:0;color:rgba(255,255,255,.78);font-size:1rem}
.tile.lead .v{font-size:1.9rem}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img id="logo" alt="Triple Y" width="420" height="238">
    <h1>תוספת תשלומים</h1>
  </header>

  <section class="inputs">
    <div class="field" id="f-amount">
      <label for="amount">סכום העסקה</label>
      <div class="box">
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="4000">
        <span class="suffix" aria-hidden="true">₪</span>
      </div>
      <p class="err" id="e-amount" role="alert" hidden></p>
    </div>
    <div class="field" id="f-pay">
      <label for="payments">מספר תשלומים <span class="hint">4 עד 24</span></label>
      <div class="box">
        <input id="payments" type="text" inputmode="numeric" autocomplete="off" value="12">
      </div>
      <p class="err" id="e-pay" role="alert" hidden></p>
    </div>
  </section>

  <section class="answer" id="answer">
    <div class="tile lead">
      <h3>תוספת על התשלומים</h3>
      <div class="v" id="o-fee"></div>
    </div>
    <div class="tile"><h3>סכום מקורי</h3><div class="v" id="o-base"></div></div>
    <div class="tile"><h3>סך הכול לתשלום</h3><div class="v" id="o-total"></div></div>
    <div class="tile"><h3>תשלום ראשון</h3><div class="v" id="o-first"></div></div>
    <div class="tile"><h3 id="o-restlabel"></h3><div class="v" id="o-rest"></div></div>
  </section>

</div>
<script src="shared.js"></script>
</body>
</html>
