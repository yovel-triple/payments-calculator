<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>4 · טיפוגרפי</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* אפשרות 4 · טיפוגרפי
   בלי כרטיסים ובלי מסגרות. רק לבן, קווי שיער, ומרווח נדיב.
   כל המספרים באותו גודל, וההיררכיה נובעת מקו שחור וממשקל. */
:root{
  --ink:#121212; --muted:#727980; --rule:#E4E7E9;
  --err:#B42318;
}
*{box-sizing:border-box}
body{
  margin:0; background:#fff; color:var(--ink);
  font:400 17px/1.6 Rubik,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:clamp(30px,6vw,64px) 22px 64px;
}
.wrap{max-width:460px;margin:0 auto}
.masthead{margin-bottom:40px}
.masthead img{width:146px;height:auto;display:block}
.masthead h1{
  margin:18px 0 0;font-size:1.25rem;font-weight:400;color:var(--muted);
  letter-spacing:.01em;
}

.field{margin-bottom:26px}
.field label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.hint{opacity:.75;white-space:nowrap}
.field .line{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:8px;transition:border-color .12s}
.field .line:focus-within{border-color:var(--ink)}
.field input{flex:1 1 auto;min-width:0;width:100%;border:0;outline:0;background:transparent;
  font:400 1.9rem/1.2 Rubik,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);
  padding:0;text-align:start}
.field .unit{color:var(--muted);font-size:1rem}
.field.bad .line{border-color:var(--err)}
.field.bad input{color:var(--err)}
.err{display:flex;gap:6px;margin:8px 0 0;font-size:.88rem;color:var(--err);line-height:1.45}
.err[hidden]{display:none}
.err::before{content:"!";flex:0 0 auto;width:16px;height:16px;margin-top:3px;display:grid;
  place-items:center;border-radius:50%;background:var(--err);color:#fff;font-size:.7rem;font-weight:700}

.answer{margin-top:44px}
.answer.void{opacity:.26}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:14px 0;padding-inline-end:14px}
.r + .r{border-top:1px solid var(--rule)}
.r .k{color:var(--muted);font-size:1rem}
.r .v{font-weight:500;font-size:1.15rem}

/* ההדגשה היחידה בדף: קו שחור לצד השורה, ומשקל. לא גודל, ולא צבע. */
.r.lead{
  padding-inline-start:16px;
  box-shadow:inset -4px 0 0 var(--ink);
}
.r.lead .k{color:var(--ink);font-weight:500}
.r.lead .v{font-weight:700;font-size:1.35rem}

.r.total{border-top:1px solid var(--ink)}
.r.total .k{color:var(--ink);font-weight:700}
.r.total .v{font-weight:700}

.group{margin-top:26px;padding-top:6px;border-top:1px solid var(--rule)}
.group .cap{font-size:.8rem;letter-spacing:.1em;color:var(--muted);padding:8px 0}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img id="logo" alt="Triple Y" width="420" height="238">
    <h1>תוספת תשלומים</h1>
  </header>

  <div class="field" id="f-amount">
    <label for="amount">סכום העסקה</label>
    <div class="line">
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="4000">
      <span class="unit">₪</span>
    </div>
    <p class="err" id="e-amount" role="alert" hidden></p>
  </div>

  <div class="field" id="f-pay">
    <label for="payments">מספר תשלומים <span class="hint">4 עד 24</span></label>
    <div class="line">
      <input id="payments" type="text" inputmode="numeric" autocomplete="off" value="12">
      <span class="unit">תשלומים</span>
    </div>
    <p class="err" id="e-pay" role="alert" hidden></p>
  </div>

  <div class="answer" id="answer">
    <div class="r lead"><span class="k">תוספת על התשלומים</span><span class="v" id="o-fee"></span></div>
    <div class="r"><span class="k">סכום מקורי</span><span class="v" id="o-base"></span></div>
    <div class="r total"><span class="k">סך הכול לתשלום</span><span class="v" id="o-total"></span></div>
    <div class="group">
      <div class="cap">פריסת התשלומים</div>
      <div class="r"><span class="k">תשלום ראשון</span><span class="v" id="o-first"></span></div>
      <div class="r"><span class="k" id="o-restlabel"></span><span class="v" id="o-rest"></span></div>
    </div>
  </div>

</div>
<script src="shared.js"></script>
</body>
</html>
