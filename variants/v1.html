<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>1 · קבלה</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* אפשרות 1 · קבלה
   עמודה צרה על לבן, בלי מסגרות, עם קו מנוקד בין התווית לערך.
   ההיררכיה נשענת על משקל ועל קווים, ולא על גודל. */
:root{
  --ink:#121212; --muted:#6C7378; --rule:#DFE3E5; --soft:#F5F7F8;
  --err:#B42318; --err-bg:#FEF3F2;
}
*{box-sizing:border-box}
body{
  margin:0; background:#fff; color:var(--ink);
  font:400 17px/1.6 Rubik,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:clamp(28px,6vw,52px) 20px 56px;
}
.wrap{max-width:420px;margin:0 auto}
.masthead{text-align:center;margin-bottom:34px}
.masthead img{width:150px;height:auto}
.masthead h1{margin:12px 0 0;font-size:1.3rem;font-weight:700}

.field{margin-bottom:20px}
.field label{display:block;font-size:.92rem;color:var(--muted);margin-bottom:6px}
.hint{opacity:.75;white-space:nowrap}
.field .line{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.field input{
  flex:1 1 auto;min-width:0;width:100%;border:0;outline:0;background:transparent;
  font:700 1.6rem/1.2 Rubik,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);
  padding:0;text-align:start;
}
.field .unit{color:var(--muted);font-size:1rem}
.field.bad .line{border-color:var(--err)}
.field.bad input{color:var(--err)}
.err{display:flex;gap:6px;margin:7px 0 0;font-size:.88rem;color:var(--err);line-height:1.45}
.err[hidden]{display:none}
.err::before{content:"!";flex:0 0 auto;width:16px;height:16px;margin-top:3px;display:grid;
  place-items:center;border-radius:50%;background:var(--err);color:#fff;font-size:.7rem;font-weight:700}

/* ── הקבלה ── */
.answer{margin-top:34px;border-top:2px solid var(--ink);padding-top:6px}
.answer.void{opacity:.26}
.r{display:flex;align-items:baseline;gap:10px;padding:11px 0}
.r + .r{border-top:1px solid var(--rule)}
.r .k{color:var(--muted);font-size:1rem;white-space:nowrap}
.r .dots{flex:1 1 auto;border-bottom:1px dotted var(--rule);transform:translateY(-4px)}
.r .v{font-weight:500;font-size:1.1rem;white-space:nowrap}

.r.lead{padding:15px 0}
.r.lead .k{color:var(--ink);font-weight:500}
.r.lead .v{font-weight:700;font-size:1.45rem}

.r.total{border-top:2px solid var(--ink)}
.r.total .k{color:var(--ink);font-weight:700}
.r.total .v{font-weight:700;font-size:1.2rem}

.split{margin-top:6px;border-top:1px solid var(--rule);padding-top:4px}
.split .r .k{font-size:.98rem}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img id="logo" alt="Triple Y" width="420" height="238">
    <h1>תוספת תשלומים</h1>
  </header>

  <div class="field" id="f-amount">
    <label for="amount">סכום העסקה</label>
    <div class="line">
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="4000">
      <span class="unit">₪</span>
    </div>
    <p class="err" id="e-amount" role="alert" hidden></p>
  </div>

  <div class="field" id="f-pay">
    <label for="payments">מספר תשלומים <span class="hint">4 עד 24</span></label>
    <div class="line">
      <input id="payments" type="text" inputmode="numeric" autocomplete="off" value="12">
      <span class="unit">תשלומים</span>
    </div>
    <p class="err" id="e-pay" role="alert" hidden></p>
  </div>

  <div class="answer" id="answer">
    <div class="r lead">
      <span class="k">תוספת על התשלומים</span><span class="dots"></span><span class="v" id="o-fee"></span>
    </div>
    <div class="r">
      <span class="k">סכום מקורי</span><span class="dots"></span><span class="v" id="o-base"></span>
    </div>
    <div class="r total">
      <span class="k">סך הכול לתשלום</span><span class="dots"></span><span class="v" id="o-total"></span>
    </div>
    <div class="split">
      <div class="r">
        <span class="k">תשלום ראשון</span><span class="dots"></span><span class="v" id="o-first"></span>
      </div>
      <div class="r">
        <span class="k" id="o-restlabel"></span><span class="dots"></span><span class="v" id="o-rest"></span>
      </div>
    </div>
  </div>

</div>
<script src="shared.js"></script>
</body>
</html>
